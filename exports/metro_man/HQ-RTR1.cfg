! NetArchitect generated configuration - Metro MAN - HQ + 2 remote sites + FinTech colo
! Device: HQ-RTR1   Platform: ISR4331 / Router-PT
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname HQ-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - HQ-RTR1^
!
ip dhcp excluded-address 10.20.0.1 10.20.0.10
ip dhcp pool HQ-USERS
 network 10.20.0.0 255.255.255.0
 default-router 10.20.0.1
 dns-server 10.20.1.138
!
ip dhcp excluded-address 10.20.1.1 10.20.1.10
ip dhcp pool HQ-VOICE
 network 10.20.1.0 255.255.255.128
 default-router 10.20.1.1
 dns-server 10.20.1.138
!
class-map match-any VOICE
 match dscp ef
class-map match-any TRADING
 match dscp af41
 match access-group name TRADING-TRAFFIC
!
policy-map METRO-EGRESS-QOS
 class VOICE
  priority percent 20
 class TRADING
  bandwidth percent 40
 class class-default
  fair-queue
!
ip access-list extended TRADING-TRAFFIC
 permit ip any 10.20.4.0 0.0.0.31
 permit ip 10.20.4.0 0.0.0.31 any
!
interface Loopback0
 ip address 10.20.1.192 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description HQ-USERS 10.20.0.0/24
 encapsulation dot1Q 10
 ip address 10.20.0.1 255.255.255.0
!
interface GigabitEthernet0/0.20
 description HQ-VOICE 10.20.1.0/25
 encapsulation dot1Q 20
 ip address 10.20.1.1 255.255.255.128
!
interface GigabitEthernet0/0.30
 description HQ-SERVERS 10.20.1.128/27
 encapsulation dot1Q 30
 ip address 10.20.1.129 255.255.255.224
!
interface GigabitEthernet0/0.99
 description HQ-MGMT 10.20.1.160/27
 encapsulation dot1Q 99
 ip address 10.20.1.161 255.255.255.224
!
interface GigabitEthernet1/0
 description PRIMARY to REMA-RTR1 - OS2 SMF (9/125 um) / 10GBASE-ER SFP+ / 15 km
 ip address 10.20.2.208 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet2/0
 description SECONDARY to REMA-RTR1 - Carrier EVPL (MEF E-Line) / 1000BASE-LX SFP to carrier NID / 18 km
 ip address 10.20.2.210 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 100
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet3/0
 description PRIMARY to REMB-RTR1 - OS2 SMF (9/125 um) / 10G-ZR SFP+ / 35 km
 ip address 10.20.3.208 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet4/0
 description SECONDARY to REMB-RTR1 - Carrier EVPL (MEF E-Line) / 1000BASE-LX SFP to carrier NID / 38 km
 ip address 10.20.3.210 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 100
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet5/0
 description PRIMARY to COLO-RTR1 - OS2 SMF (9/125 um) / 10GBASE-ER SFP+ / 22 km
 ip address 10.20.4.48 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet6/0
 description SECONDARY to COLO-RTR1 - Carrier EVPL (MEF E-Line) / 10GBASE-LR SFP+ to carrier NID / 25 km
 ip address 10.20.4.50 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 100
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
router ospf 1
 router-id 10.20.1.192
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet2/0
 no passive-interface GigabitEthernet3/0
 no passive-interface GigabitEthernet4/0
 no passive-interface GigabitEthernet5/0
 no passive-interface GigabitEthernet6/0
 network 10.20.0.0 0.0.0.255 area 0
 network 10.20.1.0 0.0.0.127 area 0
 network 10.20.1.128 0.0.0.31 area 0
 network 10.20.1.160 0.0.0.31 area 0
 network 10.20.1.192 0.0.0.0 area 0
 network 10.20.2.208 0.0.0.1 area 1
 network 10.20.2.210 0.0.0.1 area 1
 network 10.20.3.208 0.0.0.1 area 2
 network 10.20.3.210 0.0.0.1 area 2
 network 10.20.4.48 0.0.0.1 area 0
 network 10.20.4.50 0.0.0.1 area 0
 area 1 range 10.20.2.0 255.255.255.0
 area 2 range 10.20.3.0 255.255.255.0
 bfd all-interfaces
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
