! NetArchitect generated configuration - Metro MAN - HQ + 2 remote sites + FinTech colo
! Device: REMA-RTR1   Platform: ISR4331 / Router-PT
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname REMA-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - REMA-RTR1^
!
ip dhcp excluded-address 10.20.2.1 10.20.2.10
ip dhcp pool REMA-USERS
 network 10.20.2.0 255.255.255.128
 default-router 10.20.2.1
 dns-server 10.20.1.138
!
ip dhcp excluded-address 10.20.2.129 10.20.2.138
ip dhcp pool REMA-VOICE
 network 10.20.2.128 255.255.255.192
 default-router 10.20.2.129
 dns-server 10.20.1.138
!
class-map match-any VOICE
 match dscp ef
class-map match-any TRADING
 match dscp af41
 match access-group name TRADING-TRAFFIC
!
policy-map METRO-EGRESS-QOS
 class VOICE
  priority percent 20
 class TRADING
  bandwidth percent 40
 class class-default
  fair-queue
!
ip access-list extended TRADING-TRAFFIC
 permit ip any 10.20.4.0 0.0.0.31
 permit ip 10.20.4.0 0.0.0.31 any
!
interface Loopback0
 ip address 10.20.2.212 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.10
 description REMA-USERS 10.20.2.0/25
 encapsulation dot1Q 10
 ip address 10.20.2.1 255.255.255.128
!
interface GigabitEthernet0/0.20
 description REMA-VOICE 10.20.2.128/26
 encapsulation dot1Q 20
 ip address 10.20.2.129 255.255.255.192
!
interface GigabitEthernet0/0.99
 description REMA-MGMT 10.20.2.192/28
 encapsulation dot1Q 99
 ip address 10.20.2.193 255.255.255.240
!
interface GigabitEthernet1/0
 description PRIMARY to HQ-RTR1 - OS2 SMF (9/125 um) / 10GBASE-ER SFP+ / 15 km
 ip address 10.20.2.209 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet2/0
 description SECONDARY to HQ-RTR1 - Carrier EVPL (MEF E-Line) / 1000BASE-LX SFP to carrier NID / 18 km
 ip address 10.20.2.211 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 100
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
router ospf 1
 router-id 10.20.2.212
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet2/0
 network 10.20.2.0 0.0.0.127 area 1
 network 10.20.2.128 0.0.0.63 area 1
 network 10.20.2.192 0.0.0.15 area 1
 network 10.20.2.212 0.0.0.0 area 1
 network 10.20.2.208 0.0.0.1 area 1
 network 10.20.2.210 0.0.0.1 area 1
 bfd all-interfaces
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
