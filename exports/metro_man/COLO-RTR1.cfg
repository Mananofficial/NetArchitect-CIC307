! NetArchitect generated configuration - Metro MAN - HQ + 2 remote sites + FinTech colo
! Device: COLO-RTR1   Platform: ISR4331 / Router-PT
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname COLO-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - COLO-RTR1^
!
class-map match-any VOICE
 match dscp ef
class-map match-any TRADING
 match dscp af41
 match access-group name TRADING-TRAFFIC
!
policy-map METRO-EGRESS-QOS
 class VOICE
  priority percent 20
 class TRADING
  bandwidth percent 40
 class class-default
  fair-queue
!
ip access-list extended TRADING-TRAFFIC
 permit ip any 10.20.4.0 0.0.0.31
 permit ip 10.20.4.0 0.0.0.31 any
!
ip access-list extended COLO-PROTECT
 remark trading UI
 permit tcp 10.20.0.0 0.0.0.255 10.20.4.0 0.0.0.31 eq 443
 remark app/DB replication
 permit ip 10.20.1.128 0.0.0.31 10.20.4.0 0.0.0.31
 remark NOC
 permit ip 10.20.1.160 0.0.0.31 10.20.4.0 0.0.0.31
 remark replies to sessions opened by trading servers
 permit tcp any 10.20.4.0 0.0.0.31 established
 remark NTP replies (trade timestamping)
 permit udp any eq 123 10.20.4.0 0.0.0.31
 remark DNS replies
 permit udp 10.20.1.128 0.0.0.31 eq 53 10.20.4.0 0.0.0.31
 remark default deny
 deny ip any any log
!
interface Loopback0
 ip address 10.20.4.52 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.40
 description COLO-TRADING 10.20.4.0/27
 encapsulation dot1Q 40
 ip address 10.20.4.1 255.255.255.224
 ip access-group COLO-PROTECT out
!
interface GigabitEthernet0/0.99
 description COLO-MGMT 10.20.4.32/28
 encapsulation dot1Q 99
 ip address 10.20.4.33 255.255.255.240
!
interface GigabitEthernet1/0
 description PRIMARY to HQ-RTR1 - OS2 SMF (9/125 um) / 10GBASE-ER SFP+ / 22 km
 ip address 10.20.4.49 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
interface GigabitEthernet2/0
 description SECONDARY to HQ-RTR1 - Carrier EVPL (MEF E-Line) / 10GBASE-LR SFP+ to carrier NID / 25 km
 ip address 10.20.4.51 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 100
 bfd interval 300 min_rx 300 multiplier 3
 service-policy output METRO-EGRESS-QOS
 no shutdown
!
router ospf 1
 router-id 10.20.4.52
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet2/0
 network 10.20.4.0 0.0.0.31 area 0
 network 10.20.4.32 0.0.0.15 area 0
 network 10.20.4.52 0.0.0.0 area 0
 network 10.20.4.48 0.0.0.1 area 0
 network 10.20.4.50 0.0.0.1 area 0
 bfd all-interfaces
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
