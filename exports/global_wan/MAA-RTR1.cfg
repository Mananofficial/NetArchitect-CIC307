! NetArchitect generated configuration - Global WAN - 4 cities + Cloud VPC, 2,000 IoT/scanners
! Device: MAA-RTR1   Platform: ISR4331 / CSR1000v (GNS3)
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname MAA-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - MAA-RTR1^
!
ip dhcp excluded-address 10.50.20.1 10.50.20.10
ip dhcp pool MAA-IOT
 network 10.50.20.0 255.255.254.0
 default-router 10.50.20.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.22.1 10.50.22.10
ip dhcp pool MAA-SCANNERS
 network 10.50.22.0 255.255.255.0
 default-router 10.50.22.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.23.1 10.50.23.10
ip dhcp pool MAA-USERS
 network 10.50.23.0 255.255.255.128
 default-router 10.50.23.1
 dns-server 1.1.1.1
!
interface Loopback0
 ip address 10.50.23.162 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.30
 description MAA-IOT 10.50.20.0/23
 encapsulation dot1Q 30
 ip address 10.50.20.1 255.255.254.0
!
interface GigabitEthernet0/0.40
 description MAA-SCANNERS 10.50.22.0/24
 encapsulation dot1Q 40
 ip address 10.50.22.1 255.255.255.0
!
interface GigabitEthernet0/0.10
 description MAA-USERS 10.50.23.0/25
 encapsulation dot1Q 10
 ip address 10.50.23.1 255.255.255.128
!
interface GigabitEthernet0/0.99
 description MAA-MGMT 10.50.23.128/27
 encapsulation dot1Q 99
 ip address 10.50.23.129 255.255.255.224
!
interface GigabitEthernet1/0
 description PRIMARY to DEL-RTR1 - Carrier WAN circuit (MEF E-Line / Internet) / 1000BASE-LX SFP at carrier NID / 2200 km
 ip address 10.50.23.161 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.50.23.162
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 network 10.50.20.0 0.0.1.255 area 3
 network 10.50.22.0 0.0.0.255 area 3
 network 10.50.23.0 0.0.0.127 area 3
