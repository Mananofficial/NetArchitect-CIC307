 network 10.50.23.162 0.0.0.0 area 3
 network 10.50.23.160 0.0.0.1 area 3
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
