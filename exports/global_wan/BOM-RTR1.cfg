! NetArchitect generated configuration - Global WAN - 4 cities + Cloud VPC, 2,000 IoT/scanners
! Device: BOM-RTR1   Platform: ISR4331 / CSR1000v (GNS3)
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname BOM-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - BOM-RTR1^
!
ip dhcp excluded-address 10.50.8.1 10.50.8.10
ip dhcp pool BOM-IOT
 network 10.50.8.0 255.255.254.0
 default-router 10.50.8.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.10.1 10.50.10.10
ip dhcp pool BOM-USERS
 network 10.50.10.0 255.255.255.0
 default-router 10.50.10.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.11.1 10.50.11.10
ip dhcp pool BOM-SCANNERS
 network 10.50.11.0 255.255.255.0
 default-router 10.50.11.1
 dns-server 1.1.1.1
!
interface Loopback0
 ip address 10.50.12.34 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.30
 description BOM-IOT 10.50.8.0/23
 encapsulation dot1Q 30
 ip address 10.50.8.1 255.255.254.0
!
interface GigabitEthernet0/0.10
 description BOM-USERS 10.50.10.0/24
 encapsulation dot1Q 10
 ip address 10.50.10.1 255.255.255.0
!
interface GigabitEthernet0/0.40
 description BOM-SCANNERS 10.50.11.0/24
 encapsulation dot1Q 40
 ip address 10.50.11.1 255.255.255.0
!
interface GigabitEthernet0/0.99
 description BOM-MGMT 10.50.12.0/27
 encapsulation dot1Q 99
 ip address 10.50.12.1 255.255.255.224
!
interface GigabitEthernet1/0
 description PRIMARY to DEL-RTR1 - Carrier WAN circuit (MEF E-Line / Internet) / 1000BASE-LX SFP at carrier NID / 1400 km
 ip address 10.50.12.33 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.50.12.34
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 network 10.50.8.0 0.0.1.255 area 1
 network 10.50.10.0 0.0.0.255 area 1
 network 10.50.11.0 0.0.0.255 area 1
 network 10.50.12.0 0.0.0.31 area 1
 network 10.50.12.34 0.0.0.0 area 1
 network 10.50.12.32 0.0.0.1 area 1
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
