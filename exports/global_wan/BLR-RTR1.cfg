! NetArchitect generated configuration - Global WAN - 4 cities + Cloud VPC, 2,000 IoT/scanners
! Device: BLR-RTR1   Platform: ISR4331 / CSR1000v (GNS3)
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname BLR-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - BLR-RTR1^
!
ip dhcp excluded-address 10.50.16.1 10.50.16.10
ip dhcp pool BLR-IOT
 network 10.50.16.0 255.255.254.0
 default-router 10.50.16.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.18.1 10.50.18.10
ip dhcp pool BLR-SCANNERS
 network 10.50.18.0 255.255.255.0
 default-router 10.50.18.1
 dns-server 1.1.1.1
!
ip dhcp excluded-address 10.50.19.1 10.50.19.10
ip dhcp pool BLR-USERS
 network 10.50.19.0 255.255.255.128
 default-router 10.50.19.1
 dns-server 1.1.1.1
!
interface Loopback0
 ip address 10.50.19.162 255.255.255.255
!
interface GigabitEthernet0/0
 description 802.1Q trunk to site LAN switch
 no ip address
 no shutdown
!
interface GigabitEthernet0/0.30
 description BLR-IOT 10.50.16.0/23
 encapsulation dot1Q 30
 ip address 10.50.16.1 255.255.254.0
!
interface GigabitEthernet0/0.40
 description BLR-SCANNERS 10.50.18.0/24
 encapsulation dot1Q 40
 ip address 10.50.18.1 255.255.255.0
!
interface GigabitEthernet0/0.10
 description BLR-USERS 10.50.19.0/25
 encapsulation dot1Q 10
 ip address 10.50.19.1 255.255.255.128
!
interface GigabitEthernet0/0.99
 description BLR-MGMT 10.50.19.128/27
 encapsulation dot1Q 99
 ip address 10.50.19.129 255.255.255.224
!
interface GigabitEthernet1/0
 description PRIMARY to DEL-RTR1 - Carrier WAN circuit (MEF E-Line / Internet) / 1000BASE-LX SFP at carrier NID / 2150 km
 ip address 10.50.19.161 255.255.255.254
 ip ospf network point-to-point
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.50.19.162
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0
 network 10.50.16.0 0.0.1.255 area 2
 network 10.50.18.0 0.0.0.255 area 2
 network 10.50.19.0 0.0.0.127 area 2
 network 10.50.19.128 0.0.0.31 area 2
 network 10.50.19.162 0.0.0.0 area 2
 network 10.50.19.160 0.0.0.1 area 2
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
