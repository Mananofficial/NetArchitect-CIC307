! NetArchitect generated configuration - Campus LAN - 3 buildings, 1,600 endpoints
! Device: EDGE-RTR1   Platform: ISR4331
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname EDGE-RTR1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - EDGE-RTR1^
!
interface GigabitEthernet0/0/0
 description L3 link to CORE-SW1
 ip address 10.10.11.225 255.255.255.254
 ip ospf network point-to-point
 ip nat inside
 no shutdown
!
interface GigabitEthernet0/0/1
 description ISP uplink
 ip address 203.0.113.2 255.255.255.252
 ip nat outside
 no shutdown
!
interface Loopback0
 ip address 10.10.11.227 255.255.255.255
!
ip access-list standard NAT-INSIDE
 permit 10.10.0.0 0.0.255.255
!
ip nat inside source list NAT-INSIDE interface GigabitEthernet0/0/1 overload
ip route 0.0.0.0 0.0.0.0 203.0.113.1
!
router ospf 1
 router-id 10.10.11.227
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 network 10.10.11.224 0.0.0.1 area 0
 network 10.10.11.227 0.0.0.0 area 0
 default-information originate
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
