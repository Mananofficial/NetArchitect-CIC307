! NetArchitect generated configuration - Campus LAN - 3 buildings, 1,600 endpoints
! Device: BLDG-B-ACC1   Platform: Catalyst 2960-24TT
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname BLDG-B-ACC1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - BLDG-B-ACC1^
!
spanning-tree mode rapid-pvst
!
vlan 11
 name STAFF-B
vlan 20
 name VOICE
vlan 30
 name WIFI-CORP
vlan 40
 name GUEST-WIFI
vlan 50
 name AP-MGMT
vlan 99
 name NET-MGMT
vlan 999
 name NATIVE-UNUSED
vlan 998
 name PARKING-UNUSED
!
interface range FastEthernet0/1 - 20
 description USER PORTS (PC + IP phone)
 switchport mode access
 switchport access vlan 11
 switchport voice vlan 20
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/21 - 22
 description PoE ACCESS POINTS
 switchport mode access
 switchport access vlan 50
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/23 - 24
 description UNUSED - parked and shut
 switchport mode access
 switchport access vlan 998
 shutdown
!
interface Port-channel1
 description UPLINK to CORE-SW1 (OM4 MMF (50/125 um))
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 11,20,30,40,50,99
 switchport nonegotiate
!
interface GigabitEthernet0/1
 description UPLINK to CORE-SW1 (OM4 MMF (50/125 um))
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 11,20,30,40,50,99
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
!
interface GigabitEthernet0/2
 description UPLINK to CORE-SW1 (OM4 MMF (50/125 um))
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 11,20,30,40,50,99
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
!
interface Vlan99
 description switch management
 ip address 10.10.11.204 255.255.255.224
 no shutdown
!
ip default-gateway 10.10.11.193
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
