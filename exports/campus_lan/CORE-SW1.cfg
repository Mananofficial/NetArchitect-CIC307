! NetArchitect generated configuration - Campus LAN - 3 buildings, 1,600 endpoints
! Device: CORE-SW1   Platform: Catalyst 3650-24PS
! Replace every CHANGE-ME secret before production use.
!
enable
configure terminal
hostname CORE-SW1
no ip domain-lookup
ip domain-name netarchitect.local
service password-encryption
enable secret CHANGE-ME-enable
username netadmin privilege 15 secret CHANGE-ME-admin
banner motd ^Authorized access only - CORE-SW1^
!
ip routing
spanning-tree mode rapid-pvst
spanning-tree vlan 10,11,12,20,30,40,50,60,99,999 priority 4096
!
vlan 10
 name STAFF-A
vlan 11
 name STAFF-B
vlan 12
 name STAFF-C
vlan 20
 name VOICE
vlan 30
 name WIFI-CORP
vlan 40
 name GUEST-WIFI
vlan 50
 name AP-MGMT
vlan 60
 name SERVERS
vlan 99
 name NET-MGMT
vlan 999
 name NATIVE-UNUSED
vlan 998
 name PARKING-UNUSED
!
ip access-list extended GUEST-ISOLATION
 remark DHCP
 permit udp any any eq 67
 remark DNS only
 permit udp 10.10.10.0 0.0.0.255 10.10.11.128 0.0.0.63 eq 53
 remark no access to internal RFC1918 space
 deny ip 10.10.10.0 0.0.0.255 10.10.0.0 0.0.255.255
 remark Internet
 permit ip 10.10.10.0 0.0.0.255 any
!
ip access-list extended PROTECT-MGMT
 remark jump host SSH to mgmt hosts
 permit tcp 10.10.11.128 0.0.0.63 10.10.11.192 0.0.0.31 eq 22
 remark SNMP polling of mgmt-VLAN devices
 permit udp 10.10.11.128 0.0.0.63 10.10.11.192 0.0.0.31 eq 161
 remark return traffic for sessions opened by mgmt hosts
 permit tcp any 10.10.11.192 0.0.0.31 established
 remark SNMP responses from managed devices
 permit udp any eq 161 10.10.11.192 0.0.0.31
 remark DNS replies
 permit udp 10.10.11.128 0.0.0.63 eq 53 10.10.11.192 0.0.0.31
 remark ping/traceroute replies
 permit icmp any 10.10.11.192 0.0.0.31
 remark block all other access to mgmt VLAN
 deny ip any 10.10.11.192 0.0.0.31 log
!
interface Vlan10
 description STAFF-A gateway 10.10.0.0/23
 ip address 10.10.0.1 255.255.254.0
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan11
 description STAFF-B gateway 10.10.2.0/23
 ip address 10.10.2.1 255.255.254.0
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan12
 description STAFF-C gateway 10.10.4.0/23
 ip address 10.10.4.1 255.255.254.0
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan20
 description VOICE gateway 10.10.6.0/23
 ip address 10.10.6.1 255.255.254.0
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan30
 description WIFI-CORP gateway 10.10.8.0/23
 ip address 10.10.8.1 255.255.254.0
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan40
 description GUEST-WIFI gateway 10.10.10.0/24
 ip address 10.10.10.1 255.255.255.0
 ip helper-address 10.10.11.138
 ip access-group GUEST-ISOLATION in
 no shutdown
!
interface Vlan50
 description AP-MGMT gateway 10.10.11.0/25
 ip address 10.10.11.1 255.255.255.128
 ip helper-address 10.10.11.138
 no shutdown
!
interface Vlan60
 description SERVERS gateway 10.10.11.128/26
 ip address 10.10.11.129 255.255.255.192
 no shutdown
!
interface Vlan99
 description NET-MGMT gateway 10.10.11.192/27
 ip address 10.10.11.193 255.255.255.224
 ip access-group PROTECT-MGMT out
 no shutdown
!
interface GigabitEthernet1/0/1
 description TRUNK to BLDG-A-ACC1 (Cat6a U/FTP, 10GBASE-T (RJ45), 45 m)
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,60,99
 switchport nonegotiate
 no shutdown
!
