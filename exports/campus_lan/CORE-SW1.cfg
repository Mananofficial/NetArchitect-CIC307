!
router ospf 1
 router-id 10.10.11.226
 auto-cost reference-bandwidth 100000
 passive-interface default
 no passive-interface GigabitEthernet1/0/24
 network 10.10.0.0 0.0.1.255 area 0
 network 10.10.2.0 0.0.1.255 area 0
 network 10.10.4.0 0.0.1.255 area 0
 network 10.10.6.0 0.0.1.255 area 0
 network 10.10.8.0 0.0.1.255 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.11.0 0.0.0.127 area 0
 network 10.10.11.128 0.0.0.63 area 0
 network 10.10.11.192 0.0.0.31 area 0
 network 10.10.11.224 0.0.0.1 area 0
 network 10.10.11.226 0.0.0.0 area 0
!
!
crypto key generate rsa modulus 2048
ip ssh version 2
line con 0
 logging synchronous
 login local
line vty 0 4
 login local
 transport input ssh
!
end
write memory
